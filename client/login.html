<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🔐 Login - Tienda de Abarrotes</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-container {
      max-width: 450px;
      margin: 50px auto;
      padding: 40px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: fadeInUp 0.8s ease-out;
    }

    .login-container h2 {
      text-align: center;
      color: #2c3e50;
      font-size: 2.2rem;
      margin-bottom: 30px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #34495e;
      font-size: 1rem;
    }

    .form-group input {
      width: 100%;
      padding: 15px;
      border: 2px solid #ecf0f1;
      border-radius: 15px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.9);
    }

    .form-group input:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
      transform: translateY(-1px);
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(52, 152, 219, 0.4);
    }

    .error {
      color: #e74c3c;
      margin-top: 15px;
      padding: 12px;
      background: rgba(231, 76, 60, 0.1);
      border-radius: 10px;
      border-left: 4px solid #e74c3c;
      font-weight: 500;
    }

    .success {
      color: #27ae60;
      margin-top: 15px;
      padding: 12px;
      background: rgba(39, 174, 96, 0.1);
      border-radius: 10px;
      border-left: 4px solid #27ae60;
      font-weight: 500;
    }

    .register-link {
      text-align: center;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #ecf0f1;
    }

    .register-link a {
      color: #3498db;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .register-link a:hover {
      color: #2980b9;
      text-decoration: underline;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .login-container {
        margin: 30px 20px;
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" required>
      </div>
             <div class="form-group">
         <label for="password">Contraseña:</label>
         <div style="position: relative;">
           <input type="password" id="password" required>
           <button type="button" id="togglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #7f8c8d;">
             👁️
           </button>
         </div>
       </div>
      <button type="submit" class="btn">Iniciar Sesión</button>
    </form>
    <div id="message"></div>
    <div class="register-link">
      <p>¿No tienes cuenta? <a href="/register">Regístrate aquí</a></p>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
  
  <script>
    // Configuración de Firebase (necesitarás agregar esto)
    const firebaseConfig = {
      apiKey: "AIzaSyBT_vLiQr7UEZu2pLyAz2WZzIe8u_FTPhc",
      authDomain: "proyectoabarrotes-179ea.firebaseapp.com",
      projectId: "proyectoabarrotes-179ea",
      storageBucket: "proyectoabarrotes-179ea.appspot.com",
      messagingSenderId: "1000691717590",
      appId: "1:1000691717590:web:014babf2ac74fe48258077"
    };

         // Inicializar Firebase
     firebase.initializeApp(firebaseConfig);

     // Toggle password visibility
     document.getElementById('togglePassword').addEventListener('click', function() {
       const passwordInput = document.getElementById('password');
       const toggleButton = document.getElementById('togglePassword');
       
       if (passwordInput.type === 'password') {
         passwordInput.type = 'text';
         toggleButton.textContent = '🙈';
       } else {
         passwordInput.type = 'password';
         toggleButton.textContent = '👁️';
       }
     });

     // Manejar el formulario de login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');
      
      try {
        const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
        messageDiv.innerHTML = '<p class="success">¡Login exitoso! Redirigiendo...</p>';
        
        // Guardar token en localStorage
        const token = await userCredential.user.getIdToken();
        localStorage.setItem('authToken', token);
        localStorage.setItem('userEmail', email);
        
        // Redirigir al cliente después de 1 segundo
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 1000);
        
      } catch (error) {
        messageDiv.innerHTML = `<p class="error">Error: ${error.message}</p>`;
      }
    });
  </script>
</body>
</html>
